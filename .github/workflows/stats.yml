# Regenerates assets/stats-*.svg from public GitHub data once a day.
# Uses the built-in token; add a STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
name: Profile stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git commit -m "Update profile stats"
          git push
